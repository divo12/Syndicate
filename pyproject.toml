[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "syndicate"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic==2.11.7"]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "mypy==1.17.1",
  "ruff==0.12.9",
  "radon==6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[dependency-groups]
build = ["hatchling==1.27.0", "editables==0.5"]
