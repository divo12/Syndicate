services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syndicate
      POSTGRES_PASSWORD: syndicate
      POSTGRES_DB: syndicate
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndicate"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://syndicate:syndicate@db:5432/syndicate
      SYNDICATE_ENV_FILE: /app/.env
      BENCHMARK_ROOT: /app/benchmark/ITSMBench
      ARTIFACT_ROOT: /app/.syndicate
      LINEAGE_ROOT: /app/.syndicate/lineage
      HARNESS_SEED: /app/harnesses/seed
      FRAMEWORK_LOCK: /app/requirements.lock
      EMULATOR_TARBALL: /opt/taskgen-emulator.tgz
      NEATLOGS_ENDPOINT: https://ingest.neatlogs.com
      PYTHONPATH: /app/src
    volumes:
      - ./.env:/app/.env:ro
      - ./.syndicate/itsmbench:/app/benchmark/ITSMBench:ro
      - ./.syndicate/emulator.tgz:/opt/taskgen-emulator.tgz:ro
      - ./harnesses:/app/harnesses:ro
      - ./requirements.lock:/app/requirements.lock:ro
      - ./src:/app/src:ro
    ports:
      - "8000:8000"

volumes:
  pgdata:
